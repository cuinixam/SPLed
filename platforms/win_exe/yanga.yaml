components:
- name: win_main
  sources:
  - src/main.c
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - win_scheduler
- name: win_scheduler
  sources:
  - src/os.c
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - spled

platforms:
  # Build Windows executable with clang
  - name: win_exe
    description: Build Windows executable with clang
    build_types:
      - Debug
      - Release
    build_targets:
      - all
      - build
      - compile
      - report
    cmake_generators:
      - step: CreateExecutableCMakeGenerator
        module: yanga.cmake.create_executable
      - step: CppCheckCMakeGenerator
        module: yanga.cmake.cppcheck
      - step: ReportCMakeGenerator
        module: yanga.cmake.reports
    toolchain_file: clang.cmake
    components: [win_main, win_scheduler]
