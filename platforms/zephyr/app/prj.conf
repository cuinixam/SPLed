# Zephyr settings shared by every variant. The product's features come from the
# variant's config.txt, passed as EXTRA_CONF_FILE by the ZephyrBuild step.
CONFIG_GPIO=y
CONFIG_LOG=y
# The shell replaces pc_terminal's keyboard: `spled power`, `spled up/down`.
CONFIG_SHELL=y
CONFIG_MAIN_STACK_SIZE=2048
