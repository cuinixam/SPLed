components:
- name: pc_terminal_main
  sources:
  - src/main.c
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - pc_terminal_scheduler
- name: pc_terminal_scheduler
  sources:
  - src/os.c
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - spled
  - led_interface
  - button_interface
- name: terminal_adapters
  sources:
  - src/terminal_led_adapter.c
  - src/terminal_button_adapter.c
  required_components:
  - led_interface
  - button_interface

platforms:
  # Build Windows executable with clang
  - name: pc_terminal
    description: Build PC terminal executable with clang (Windows/Linux)
    build_types:
      - Debug
      - Release
    build_targets:
      - all
      - build
      - compile
      - report
    generators:
      - step: CreateExecutableCMakeGenerator
        module: yanga.cmake.create_executable
        config:
          use_global_includes: false
      #- step: CppCheckCMakeGenerator
      #  module: yanga.cmake.cppcheck
      - step: ObjectsDepsCMakeGenerator
        module: yanga.cmake.objects_deps
      - step: TargetsDataCMakeGenerator
        module: yanga.cmake.targets_data
      - step: ReportCMakeGenerator
        module: yanga.cmake.reports
    configs:
      - id: toolchain
        file: "platforms/pc_terminal/clang.cmake"
    components: [pc_terminal_main, pc_terminal_scheduler, terminal_adapters]
