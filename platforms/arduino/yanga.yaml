components:
  - name: arduino_core
    path: .yanga/ext/ArduinoCoreAvr/cores/arduino
    sources:
      - abi.cpp
      - CDC.cpp
      - HardwareSerial.cpp
      - HardwareSerial0.cpp
      - HardwareSerial1.cpp
      - HardwareSerial2.cpp
      - HardwareSerial3.cpp
      - hooks.c
      - IPAddress.cpp
      - main.cpp
      - new.cpp
      - PluggableUSB.cpp
      - Print.cpp
      - Stream.cpp
      - USBCore.cpp
      - WInterrupts.c
      - wiring_analog.c
      - wiring_digital.c
      - wiring_pulse.c
      - wiring_pulse.S
      - wiring_shift.c
      - wiring.c
      - WMath.cpp
      - WString.cpp
    include_directories:
      - path: .
        scope: PUBLIC
  - name: arduino_pins_eightanaloginputs
    path: .yanga/ext/ArduinoCoreAvr/variants/eightanaloginputs
    include_directories:
      - path: .
        scope: PUBLIC
  - name: arduino_pins_standard
    path: .yanga/ext/ArduinoCoreAvr/variants/standard
    include_directories:
      - path: .
        scope: PUBLIC
  - name: atmega328p_xmini_pins
    path: .yanga/ext/atmel_avr_xmini/module/variants/atmega328p-xmini
    include_directories:
      - path: .
        scope: PUBLIC
  - name: arduino_main
    path: platforms/arduino/src
    sources:
    - main.cpp
    required_components:
    - platform_types
    - arduino_core
  - name: arduino_scheduler
    path: platforms/arduino/src
    sources:
    - scheduler.cpp
    required_components:
    - platform_types
    - arduino_core
  - name: arduino_button
    path: platforms/arduino/src
    sources:
    - button.cpp
    required_components:
    - platform_types
    - arduino_core
  - name: arduino_led
    path: platforms/arduino/src
    sources:
    - led.cpp
    required_components:
    - platform_types
    - arduino_core


platforms:
  # Arduino Nano platform configuration
  - name: arduino_nano
    toolchain_file: arduino_nano.cmake
    west_manifest:
      remotes:
        - name: arduino
          url-base: https://github.com/arduino
      projects:
        - name: ArduinoCore-avr
          remote: arduino
          revision: 1.8.6
          path: ArduinoCoreAvr
    scoop_manifest:
      buckets:
        - name: main
          source: https://github.com/ScoopInstaller/Main
      apps:
        - name: avr-gcc
          version: 15.2.0
          source: main
    cmake_generators:
      - step: CreateExecutableCMakeGenerator
        module: yanga.cmake.create_executable
        config:
          use_global_includes: true
      - step: CreateArduinoHexCMakeGenerator
        file: platforms/arduino/steps.py
    components: [arduino_main, arduino_scheduler, arduino_core, arduino_pins_eightanaloginputs]

  # Arduino Uno platform configuration
  - name: arduino_uno_r3
    toolchain_file: arduino_uno_r3.cmake
    west_manifest:
      remotes:
        - name: arduino
          url-base: https://github.com/arduino
        - name: atmel-avr-xmini
          url-base: https://github.com/AtmelUniversityFrance
      projects:
        - name: ArduinoCore-avr
          remote: arduino
          revision: 1.8.6
          path: ArduinoCoreAvr
        - name: atmel-avr-xmini-boardmanagermodule
          remote: atmel-avr-xmini
          revision: v0.6.0
          path: atmel_avr_xmini
    scoop_manifest:
      buckets:
        - name: main
          source: https://github.com/ScoopInstaller/Main
      apps:
        - name: avr-gcc
          version: 15.2.0
          source: main
    cmake_generators:
      - step: CreateExecutableCMakeGenerator
        module: yanga.cmake.create_executable
        config:
          use_global_includes: true
      - step: CreateArduinoHexCMakeGenerator
        file: platforms/arduino/steps.py
    components: [arduino_main, arduino_scheduler, arduino_core, atmega328p_xmini_pins]
