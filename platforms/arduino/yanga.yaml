components:
  - name: arduino_core
    path: .yanga/ext/ArduinoCoreAvr/cores/arduino
    sources:
      - abi.cpp
      - CDC.cpp
      - HardwareSerial.cpp
      - HardwareSerial0.cpp
      - HardwareSerial1.cpp
      - HardwareSerial2.cpp
      - HardwareSerial3.cpp
      - hooks.c
      - IPAddress.cpp
      - main.cpp
      - new.cpp
      - PluggableUSB.cpp
      - Print.cpp
      - Stream.cpp
      - USBCore.cpp
      - WInterrupts.c
      - wiring_analog.c
      - wiring_digital.c
      - wiring_pulse.c
      - wiring_pulse.S
      - wiring_shift.c
      - wiring.c
      - WMath.cpp
      - WString.cpp
    include_directories:
      - path: .
        scope: PUBLIC
    required_components:
      - pins
    # Do not generate docs for external component
    docs:
      exclude_productive_code: true
  - name: arduino_pins_eightanaloginputs
    alias: pins
    path: .yanga/ext/ArduinoCoreAvr/variants/eightanaloginputs
    include_directories:
      - path: .
        scope: PUBLIC
  - name: arduino_pins_standard
    alias: pins
    path: .yanga/ext/ArduinoCoreAvr/variants/standard
    include_directories:
      - path: .
        scope: PUBLIC
  - name: atmega328p_xmini_pins
    alias: pins
    path: .yanga/ext/atmel_avr_xmini/module/variants/atmega328p-xmini
    include_directories:
      - path: .
        scope: PUBLIC
  - name: arduino_main
    path: platforms/arduino/src
    sources:
    - main.cpp
    required_components:
    - platform_types
    - arduino_core
    - rte
  - name: arduino_scheduler
    path: platforms/arduino/src
    sources:
    - scheduler.cpp
    include_directories:
      - path: .
        scope: PUBLIC
    required_components:
    - platform_types
    - arduino_core
  - name: arduino_button
    path: platforms/arduino/src
    sources:
    - button.cpp
    required_components:
    - platform_types
    - arduino_core
    - button_interface
  - name: arduino_led
    path: platforms/arduino/src
    sources:
    - led.cpp
    required_components:
    - platform_types
    - arduino_core
    - led_interface


platforms:
  # Arduino Nano platform configuration
  - name: arduino_nano
    configs:
      - id: west
        file: platforms/arduino/west.yaml
      - id: poks
        file: platforms/arduino/poks.json
      - id: toolchain
        file: "platforms/arduino/arduino_nano.cmake"

    generators:
      - step: CreateExecutableCMakeGenerator
        module: yanga.cmake.create_executable
        config:
          use_global_includes: true
      - step: CreateArduinoHexCMakeGenerator
        file: platforms/arduino/steps.py
    components: [arduino_main, arduino_scheduler, arduino_core, arduino_pins_eightanaloginputs]

  # Arduino Uno platform configuration
  - name: arduino_uno_r3
    build_targets:
      - all
      - build
      - compile
      - report
    configs:
      - id: west
        file: platforms/arduino/west.yaml
      - id: west
        content:
          manifest:
            remotes:
              - name: atmel-avr-xmini
                url-base: https://github.com/AtmelUniversityFrance
            projects:
              - name: atmel-avr-xmini-boardmanagermodule
                remote: atmel-avr-xmini
                revision: v0.6.0
                path: atmel_avr_xmini
      - id: poks
        file: platforms/arduino/poks.json
      - id: toolchain
        file: "platforms/arduino/arduino_uno_r3.cmake"
    generators:
      - step: CreateExecutableCMakeGenerator
        module: yanga.cmake.create_executable
        config:
          use_global_includes: false
      - step: CreateArduinoHexCMakeGenerator
        file: platforms/arduino/steps.py
      - step: ObjectsDepsCMakeGenerator
        module: yanga.cmake.objects_deps
      - step: TargetsDataCMakeGenerator
        module: yanga.cmake.targets_data
      - step: ReportCMakeGenerator
        module: yanga.cmake.reports
    components: [arduino_main, arduino_scheduler, arduino_core, atmega328p_xmini_pins]
