components:
- name: rte
  path: components/rte
  sources:
  - src/rte.c
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/keyboard_interface
- name: keyboard_interface
  path: components/keyboard_interface
  sources:
  - src/keyboard_interface.c
  include_directories:
  - path: src
    scope: PUBLIC
- name: examples_hello_gmock
  path: components/examples/hello_gmock
  docs_sources:
  - doc/index.md
  sources:
  - src/hello_gmock.c
  testing:
    sources:
    - test/test_hello_gmock_suite.cc
  include_directories:
  - path: src
    scope: PUBLIC
- name: examples_flight_controller
  path: components/examples/flight_controller
  docs_sources:
  - doc/index.md
  sources:
  - src/flight_controller.c
  testing:
    sources:
    - test/test_flight_controller.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/rte
- name: main
  path: components/main
  sources:
  - src/main.c
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/os
- name: os
  path: components/os
  sources:
  - src/os.c
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/spled
- name: spled
  path: components/spled
  sources:
  - src/spled.c
  testing:
    sources:
    - test/test_spled.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/brightness_controller
  - components/console_interface
  - components/keyboard_interface
  - components/light_controller
  - components/main_control_knob
  - components/power_button
  - components/power_signal_processing
  - components/rte
- name: power_signal_processing
  path: components/power_signal_processing
  docs_sources:
  - doc/index.md
  sources:
  - src/power_signal_processing.c
  testing:
    sources:
    - test/test_power_signal_processing.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/rte
- name: light_controller
  path: components/light_controller
  docs_sources:
  - doc/index.md
  sources:
  - src/light_controller.c
  testing:
    sources:
    - test/test_light_controller.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/rte
- name: power_button
  path: components/power_button
  docs_sources:
  - doc/index.md
  sources:
  - src/power_button.c
  testing:
    sources:
    - test/test_power_button.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/rte
- name: console_interface
  path: components/console_interface
  sources:
  - src/console_interface.c
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/rte
- name: main_control_knob
  path: components/main_control_knob
  docs_sources:
  - doc/index.md
  sources:
  - src/main_control_knob.c
  testing:
    sources:
    - test/test_main_control_knob.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/rte
- name: test_integrations_spled
  sources:
  - components/spled/src/spled.c
  - components/rte/src/rte.c
  - components/brightness_controller/src/brightness_controller.c
  - components/light_controller/src/light_controller.c
  - components/main_control_knob/src/main_control_knob.c
  - components/power_button/src/power_button.c
  - components/power_signal_processing/src/power_signal_processing.c
  testing:
    sources:
    - test/integrations/spled/test_spled.cc
  required_components:
  - components/rte
  - components/spled
  # This component is only for integration testing and should not document
  # the productive code from other components.
  docs:
    exclude_productive_code: true
- name: brightness_controller
  path: components/brightness_controller
  docs_sources:
  - doc/index.md
  sources:
  - src/brightness_controller.c
  testing:
    sources:
    - test/test_brightness_controller.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - components/rte
