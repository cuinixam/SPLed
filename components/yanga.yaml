components:
- name: rte_types
  path: components/rte
  include_directories:
  - path: src
    scope: PUBLIC
- name: rte
  path: components/rte
  sources:
  - src/rte.c
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - button_interface
  - platform_types
- name: keyboard_interface
  path: components/keyboard_interface
  sources:
  - src/keyboard_interface.c
  required_components:
  - button_interface
  - rte
- name: examples_hello_gmock
  path: components/examples/hello_gmock
  docs_sources:
  - doc/index.md
  sources:
  - src/hello_gmock.c
  testing:
    sources:
    - test/test_hello_gmock_suite.cc
  include_directories:
  - path: src
    scope: PUBLIC
- name: examples_flight_controller
  path: components/examples/flight_controller
  docs_sources:
  - doc/index.md
  sources:
  - src/flight_controller.c
  testing:
    sources:
    - test/test_flight_controller.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - rte
- name: spled
  path: components/spled
  sources:
  - src/spled.c
  testing:
    sources:
    - test/test_spled.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - brightness_controller
  - led_interface
  - light_controller
  - main_control_knob
  - power_button
  - power_signal_processing
  - rte
- name: power_signal_processing
  path: components/power_signal_processing
  docs_sources:
  - doc/index.md
  sources:
  - src/power_signal_processing.c
  testing:
    sources:
    - test/test_power_signal_processing.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - rte
- name: light_controller
  path: components/light_controller
  docs_sources:
  - doc/index.md
  sources:
  - src/light_controller.c
  testing:
    sources:
    - test/test_light_controller.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - rte
- name: power_button
  path: components/power_button
  docs_sources:
  - doc/index.md
  sources:
  - src/power_button.c
  testing:
    sources:
    - test/test_power_button.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - rte
- name: console_interface
  path: components/console_interface
  sources:
  - src/console_interface.c
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - rte
  - led_interface
- name: led_interface
  path: components/led_interface
  include_directories:
  - path: .
    scope: PUBLIC
  required_components:
  - rte
- name: button_interface
  path: components/button_interface
  include_directories:
  - path: .
    scope: PUBLIC
  required_components:
  - rte_types
- name: main_control_knob
  path: components/main_control_knob
  docs_sources:
  - doc/index.md
  sources:
  - src/main_control_knob.c
  testing:
    sources:
    - test/test_main_control_knob.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - rte
- name: test_integrations_spled
  sources:
  - spled/src/spled.c
  - rte/src/rte.c
  - brightness_controller/src/brightness_controller.c
  - light_controller/src/light_controller.c
  - main_control_knob/src/main_control_knob.c
  - power_button/src/power_button.c
  - power_signal_processing/src/power_signal_processing.c
  testing:
    sources:
    - spled/test/test_spled_integration.cc
  required_components:
  - rte
  - spled
  - led_interface
  # This component is only for integration testing and should not document
  # the productive code from other components.
  docs:
    exclude_productive_code: true
- name: brightness_controller
  path: components/brightness_controller
  docs_sources:
  - doc/index.md
  sources:
  - src/brightness_controller.c
  testing:
    sources:
    - test/test_brightness_controller.cc
  include_directories:
  - path: src
    scope: PUBLIC
  required_components:
  - rte
