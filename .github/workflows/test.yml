name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

  workflow_dispatch:

jobs:
  test-windows:
    name: Test ${{ matrix.variant }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - "BaseDev"
          - "BlinkLed"
          - "Disco"
          - "Sleep"
          - "Spa"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Installation of Dependencies and Execute Tests for ${{ matrix.variant }}
        run: |
          .\build.ps1 -install
          pytest -k "Test_${{ matrix.variant }}"
        shell: powershell

  test-unix:
    name: Test ${{ matrix.variant }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        variant:
          - "BaseDev"
          - "Sleep"
          - "Disco"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Install pypeline runner
        run: pip install pypeline-runner>=1.23
        shell: bash
      - name: Run pypeline
        run: pypeline run --config-file yanga.yaml --step CreateVEnv --single
        shell: bash
      - name: Execute Tests for ${{ matrix.variant }}
        run: .venv/bin/python -m pytest -k "Test_${{ matrix.variant }}"
        shell: bash
